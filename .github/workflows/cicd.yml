name: CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  release:
    types: [ published, created ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x86_64:
    name: Build & Test x86-64 (Linux ELF & Windows PE + Wine)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MinGW-w64 and Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 wine64

      - name: Build & test x86-64 examples natively on Linux
        run: |
          mkdir -p linux-dist
          for dir in hello_world fibonacci factorial gcd bit_manipulation string_reverse bubble_sort binary_search dot_product crc32_hash cpuid_vendor; do
            make -C examples/$dir/x86_64 TARGET_OS=linux test || exit 1
            cp examples/$dir/x86_64/$dir linux-dist/${dir}-linux-x86_64
          done
          if grep -q avx512f /proc/cpuinfo; then
            make -C examples/matrix_mul/x86_64 TARGET_OS=linux test
          else
            make -C examples/matrix_mul/x86_64 TARGET_OS=linux all
            echo "Runner lacks AVX-512; skipping matrix_mul execution test"
          fi
          cp examples/matrix_mul/x86_64/matrix_mul linux-dist/matrix_mul-linux-x86_64
          make clean-x86_64 TARGET_OS=linux

      - name: Upload Linux x86-64 executables
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-executables
          path: linux-dist/*

      - name: Cross-compile x86-64 examples to Windows .exe
        run: |
          make x86_64 TARGET_OS=windows

      - name: Verify string_reverse.exe is under 1 KB
        run: |
          SIZE=$(stat -c %s examples/string_reverse/x86_64/string_reverse.exe)
          echo "string_reverse.exe size: $SIZE bytes"
          test "$SIZE" -lt 1024

      - name: Run Windows .exe tests under Wine
        run: |
          WINEDEBUG=-all wineboot --init || true
          for dir in hello_world fibonacci factorial gcd bit_manipulation string_reverse bubble_sort binary_search dot_product crc32_hash cpuid_vendor; do
            make -C examples/$dir/x86_64 TARGET_OS=windows test || exit 1
          done
          if grep -q avx512f /proc/cpuinfo; then
            make -C examples/matrix_mul/x86_64 TARGET_OS=windows test
          else
            echo "Runner lacks AVX-512; skipping matrix_mul Wine execution test"
          fi

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: examples/*/x86_64/*.exe

  build-arm:
    name: Build & Test Arm Cortex-M55 (Helium/MVE)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Arm binutils and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi qemu-system-arm

      - name: Build and test Arm examples
        run: |
          make arm
          make test-arm

      - name: Upload Arm ELF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arm-cortex-m55-elfs
          path: examples/*/arm/*.elf

  build-riscv:
    name: Build & Test RISC-V RV32 + Zve32f (Vector)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install RISC-V binutils and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-riscv64-unknown-elf qemu-system-misc

      - name: Build and test RISC-V examples
        run: |
          make riscv
          make test-riscv

      - name: Upload RISC-V ELF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: riscv32-vector-elfs
          path: examples/*/riscv/*.elf

  release:
    name: Upload Release Assets
    needs: [ build-x86_64, build-arm, build-riscv ]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows executables
        uses: actions/download-artifact@v4
        with:
          name: windows-executables
          path: release-assets/windows

      - name: Download Linux x86-64 executables
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-executables
          path: release-assets/linux

      - name: Download Arm ELFs
        uses: actions/download-artifact@v4
        with:
          name: arm-cortex-m55-elfs
          path: release-assets/arm

      - name: Download RISC-V ELFs
        uses: actions/download-artifact@v4
        with:
          name: riscv32-vector-elfs
          path: release-assets/riscv

      - name: Stage uniquely named release assets
        run: |
          mkdir -p release-upload
          find release-assets/windows -name '*.exe' -exec cp {} release-upload/ \;
          cp release-assets/linux/* release-upload/
          for f in release-assets/arm/*/*/*.elf; do
            base=$(basename "$f" .elf)
            cp "$f" "release-upload/${base}-arm-cortex-m55.elf"
          done
          for f in release-assets/riscv/*/*/*.elf; do
            base=$(basename "$f" .elf)
            cp "$f" "release-upload/${base}-riscv32-vector.elf"
          done
          ls -la release-upload/

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
